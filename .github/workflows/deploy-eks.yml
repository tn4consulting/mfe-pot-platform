name: Deploy to AWS EKS

# Net-new workflow: unlike the 6 app repos, this repo never had a per-chart
# kind-based CI validation stage for mock-idp/strapi (validated manually so
# far -- see CLAUDE.md's "Hosting: Kubernetes + Helm" section). This workflow
# only adds the Stage 2 half (build+push to ECR, deploy to the real AWS EKS
# cluster) for those two charts; it deliberately does not also retrofit a
# kind-validation stage, out of scope for the EKS pass. See
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md for the full
# design.
#
# The demo cluster is intentionally torn down between demos (cost-conscious
# PoC) -- most pushes to main happen while it doesn't exist, so every step
# past the liveness check is individually gated on
# `steps.check.outputs.cluster_up` rather than skipping the whole job.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mock-idp/**'
      - 'apps/aws-cost-exporter/**'
      - 'tools/cms/strapi/**'
      - 'charts/mock-idp/**'
      - 'charts/aws-cost-exporter/**'
      - 'charts/strapi/**'
      - 'charts/mfe-backend-lib/**'
      - '.github/workflows/deploy-eks.yml'
  # Defaults to skip_build=true: mfe-pot/tools/deploy-eks.sh re-triggers
  # this workflow to redeploy an already-published commit to a freshly
  # recreated cluster -- rebuilding for that is pure waste when a prior
  # push-triggered run already published this exact commit's images. Each
  # job instead mirrors (pull+retag+push, no rebuild) from GHCR into ECR.
  # mfe-pot/tools/build-all.sh passes skip_build=false for the opposite
  # case: force a fresh build+publish to both registries without
  # deploying (skips the helm upgrade step entirely).
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip building and just mirror the already-published image into ECR (set false to force a rebuild without deploying)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-mock-idp:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: steps.check.outputs.cluster_up == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ECR repos here have immutable tags, and the tag is the commit SHA --
      # re-triggering this job for a commit already deployed once (e.g.
      # mfe-pot/tools/deploy-eks.sh re-pointing a freshly recreated cluster
      # at already-built images) would otherwise fail the build-push step
      # outright rather than just reusing what's already there. Same pattern
      # as every app repo's own deploy-eks job.
      - name: Check if mock-idp image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists
        run: |
          if aws ecr describe-images --repository-name mfe-pot-mock-idp --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushes to both ECR and GHCR from this one build -- unlike the 6 app
      # repos, this job has no separate kind-validation consumer to justify
      # a build-once-then-mirror split (each of these 3 images already has
      # exactly one build/deploy job), so the efficient shape here is a
      # single multi-tag push instead of building the app-repo pattern
      # where it isn't needed. GHCR gets a copy purely for registry
      # consistency / future-multi-cloud readiness (see
      # /Users/martin/.claude/plans/create-a-plan-for-cozy-globe.md).
      # Skipped on the default workflow_dispatch redeploy path (skip_build
      # left at its default true) -- see the Mirror step below instead.
      - name: Build and push mock-idp image
        if: >-
          steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mock-idp/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/mfe-pot-mock-idp:${{ github.sha }}
            ghcr.io/tn4consulting/mfe-pot-mock-idp:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      # The default workflow_dispatch redeploy path: no rebuild, just a
      # cheap pull+retag+push of the commit's image already published to
      # GHCR by an earlier push-triggered run. Mirrors the app repos'
      # deploy-eks mirror steps.
      - name: Mirror mock-idp image from GHCR to ECR
        if: >-
          steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build == 'true'
        run: |
          docker pull ghcr.io/tn4consulting/mfe-pot-mock-idp:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-mock-idp:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/mfe-pot-mock-idp:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/mfe-pot-mock-idp:${{ github.sha }}

      # Everything from here on is the actual deploy -- skipped entirely
      # in build-all.sh's build-only mode (workflow_dispatch, skip_build
      # explicitly false), since that mode's whole point is to publish
      # images without touching the live cluster.
      - name: Update kubeconfig
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')

      # No sibling checkout needed here -- mock-idp's Chart.yaml depends on
      # mfe-backend-lib via a plain same-repo relative path
      # (file://../mfe-backend-lib), not the sibling-checkout-relative path
      # the 6 app repos need.
      - name: helm dependency update
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: helm dependency update charts/mock-idp

      - name: helm upgrade --install against EKS
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: |
          helm upgrade --install mock-idp charts/mock-idp \
            -f charts/mock-idp/values.yaml \
            -f charts/mock-idp/values-eks.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed app is actually reachable over HTTPS
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://mock-idp.aws.tn4consulting.com/.well-known/jwks.json || echo 000)
            [ "$status" = "200" ] && break
            sleep 5
          done
          curl -skf https://mock-idp.aws.tn4consulting.com/.well-known/jwks.json | grep -q '"keys"'

  deploy-aws-cost-exporter:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: steps.check.outputs.cluster_up == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same immutable-tag reasoning as deploy-mock-idp's own check above.
      - name: Check if aws-cost-exporter image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists
        run: |
          if aws ecr describe-images --repository-name mfe-pot-aws-cost-exporter --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Same multi-tag reasoning as deploy-mock-idp's own build step above.
      # Skipped on the default workflow_dispatch redeploy path -- see the
      # Mirror step below instead.
      - name: Build and push aws-cost-exporter image
        if: >-
          steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/aws-cost-exporter/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/mfe-pot-aws-cost-exporter:${{ github.sha }}
            ghcr.io/tn4consulting/mfe-pot-aws-cost-exporter:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      # Same mirror reasoning as deploy-mock-idp's own Mirror step above.
      - name: Mirror aws-cost-exporter image from GHCR to ECR
        if: >-
          steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build == 'true'
        run: |
          docker pull ghcr.io/tn4consulting/mfe-pot-aws-cost-exporter:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-aws-cost-exporter:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/mfe-pot-aws-cost-exporter:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/mfe-pot-aws-cost-exporter:${{ github.sha }}

      # Everything from here on is the actual deploy -- skipped entirely
      # in build-all.sh's build-only mode, same as deploy-mock-idp above.
      - name: Update kubeconfig
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')

      # Same file://../mfe-backend-lib same-repo relative dependency as
      # charts/mock-idp -- no sibling checkout needed.
      - name: helm dependency update
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: helm dependency update charts/aws-cost-exporter

      - name: helm upgrade --install against EKS
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: |
          helm upgrade --install aws-cost-exporter charts/aws-cost-exporter \
            -f charts/aws-cost-exporter/values.yaml \
            -f charts/aws-cost-exporter/values-eks.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed pod reports healthy (cluster-internal only -- no Ingress)
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: |
          kubectl rollout status deployment/aws-cost-exporter --timeout=60s
          kubectl run aws-cost-exporter-healthcheck --rm -i --restart=Never --image=curlimages/curl:8.11.0 -- \
            curl -sf http://aws-cost-exporter.default.svc.cluster.local:3006/health

  deploy-strapi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        if: steps.check.outputs.cluster_up == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same immutable-tag reasoning as deploy-mock-idp's own check above --
      # this is the job that first surfaced the failure live (re-running
      # tools/deploy-eks.sh against an unchanged main HEAD re-triggered a
      # rebuild of a tag ECR already had, and immutability rejected it).
      - name: Check if strapi image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists
        run: |
          if aws ecr describe-images --repository-name mfe-pot-strapi --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Same multi-tag reasoning as deploy-mock-idp's own build step above.
      # Skipped on the default workflow_dispatch redeploy path -- see the
      # Mirror step below instead.
      - name: Build and push strapi image
        if: >-
          steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'true')
        uses: docker/build-push-action@v6
        with:
          context: tools/cms/strapi
          file: tools/cms/strapi/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/mfe-pot-strapi:${{ github.sha }}
            ghcr.io/tn4consulting/mfe-pot-strapi:${{ github.sha }}

      # Same mirror reasoning as deploy-mock-idp's own Mirror step above.
      - name: Mirror strapi image from GHCR to ECR
        if: >-
          steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true' &&
          github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build == 'true'
        run: |
          docker pull ghcr.io/tn4consulting/mfe-pot-strapi:${{ github.sha }}
          docker tag ghcr.io/tn4consulting/mfe-pot-strapi:${{ github.sha }} ${{ steps.ecr-login.outputs.registry }}/mfe-pot-strapi:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/mfe-pot-strapi:${{ github.sha }}

      # Everything from here on is the actual deploy -- skipped entirely
      # in build-all.sh's build-only mode, same as deploy-mock-idp above.
      - name: Update kubeconfig
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')

      - name: helm upgrade --install against EKS
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: |
          helm upgrade --install strapi charts/strapi \
            -f charts/strapi/values.yaml \
            -f charts/strapi/values-eks.yaml \
            --set strapi.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed app is actually reachable over HTTPS
        if: >-
          steps.check.outputs.cluster_up == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_build != 'false')
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://cms.aws.tn4consulting.com/_health || echo 000)
            [ "$status" = "204" ] && break
            sleep 5
          done
          status=$(curl -sk -o /dev/null -w '%{http_code}' https://cms.aws.tn4consulting.com/_health)
          [ "$status" = "204" ]
