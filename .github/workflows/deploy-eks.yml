name: Deploy to AWS EKS

# Net-new workflow: unlike the 6 app repos, this repo never had a per-chart
# kind-based CI validation stage for mock-idp/strapi (validated manually so
# far -- see CLAUDE.md's "Hosting: Kubernetes + Helm" section). This workflow
# only adds the Stage 2 half (build+push to ECR, deploy to the real AWS EKS
# cluster) for those two charts; it deliberately does not also retrofit a
# kind-validation stage, out of scope for the EKS pass. See
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md for the full
# design.
#
# The demo cluster is intentionally torn down between demos (cost-conscious
# PoC) -- most pushes to main happen while it doesn't exist, so every step
# past the liveness check is individually gated on
# `steps.check.outputs.cluster_up` rather than skipping the whole job.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mock-idp/**'
      - 'apps/aws-cost-exporter/**'
      - 'tools/cms/strapi/**'
      - 'charts/mock-idp/**'
      - 'charts/aws-cost-exporter/**'
      - 'charts/strapi/**'
      - 'charts/mfe-backend-lib/**'
      - '.github/workflows/deploy-eks.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-mock-idp:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ECR repos here have immutable tags, and the tag is the commit SHA --
      # re-triggering this job for a commit already deployed once (e.g.
      # mfe-pot/tools/deploy-eks.sh re-pointing a freshly recreated cluster
      # at already-built images) would otherwise fail the build-push step
      # outright rather than just reusing what's already there. Same pattern
      # as every app repo's own deploy-eks job.
      - name: Check if mock-idp image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists
        run: |
          if aws ecr describe-images --repository-name mfe-pot-mock-idp --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push mock-idp image
        if: steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mock-idp/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/mfe-pot-mock-idp:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      - name: Update kubeconfig
        if: steps.check.outputs.cluster_up == 'true'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: steps.check.outputs.cluster_up == 'true'

      # No sibling checkout needed here -- mock-idp's Chart.yaml depends on
      # mfe-backend-lib via a plain same-repo relative path
      # (file://../mfe-backend-lib), not the sibling-checkout-relative path
      # the 6 app repos need.
      - name: helm dependency update
        if: steps.check.outputs.cluster_up == 'true'
        run: helm dependency update charts/mock-idp

      - name: helm upgrade --install against EKS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          helm upgrade --install mock-idp charts/mock-idp \
            -f charts/mock-idp/values.yaml \
            -f charts/mock-idp/values-eks.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed app is actually reachable over HTTPS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://mock-idp.aws.tn4consulting.com/.well-known/jwks.json || echo 000)
            [ "$status" = "200" ] && break
            sleep 5
          done
          curl -skf https://mock-idp.aws.tn4consulting.com/.well-known/jwks.json | grep -q '"keys"'

  deploy-aws-cost-exporter:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Same immutable-tag reasoning as deploy-mock-idp's own check above.
      - name: Check if aws-cost-exporter image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists
        run: |
          if aws ecr describe-images --repository-name mfe-pot-aws-cost-exporter --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push aws-cost-exporter image
        if: steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/aws-cost-exporter/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/mfe-pot-aws-cost-exporter:${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN }}

      - name: Update kubeconfig
        if: steps.check.outputs.cluster_up == 'true'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: steps.check.outputs.cluster_up == 'true'

      # Same file://../mfe-backend-lib same-repo relative dependency as
      # charts/mock-idp -- no sibling checkout needed.
      - name: helm dependency update
        if: steps.check.outputs.cluster_up == 'true'
        run: helm dependency update charts/aws-cost-exporter

      - name: helm upgrade --install against EKS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          helm upgrade --install aws-cost-exporter charts/aws-cost-exporter \
            -f charts/aws-cost-exporter/values.yaml \
            -f charts/aws-cost-exporter/values-eks.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed pod reports healthy (cluster-internal only -- no Ingress)
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          kubectl rollout status deployment/aws-cost-exporter --timeout=60s
          kubectl run aws-cost-exporter-healthcheck --rm -i --restart=Never --image=curlimages/curl:8.11.0 -- \
            curl -sf http://aws-cost-exporter.default.svc.cluster.local:3006/health

  deploy-strapi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the demo cluster currently exists
        id: check
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "${{ vars.EKS_CLUSTER_NAME }}" >/dev/null 2>&1; then
            echo "cluster_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "cluster_up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Same immutable-tag reasoning as deploy-mock-idp's own check above --
      # this is the job that first surfaced the failure live (re-running
      # tools/deploy-eks.sh against an unchanged main HEAD re-triggered a
      # rebuild of a tag ECR already had, and immutability rejected it).
      - name: Check if strapi image already exists in ECR
        if: steps.check.outputs.cluster_up == 'true'
        id: image-exists
        run: |
          if aws ecr describe-images --repository-name mfe-pot-strapi --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push strapi image
        if: steps.check.outputs.cluster_up == 'true' && steps.image-exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: tools/cms/strapi
          file: tools/cms/strapi/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/mfe-pot-strapi:${{ github.sha }}

      - name: Update kubeconfig
        if: steps.check.outputs.cluster_up == 'true'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        if: steps.check.outputs.cluster_up == 'true'

      - name: helm upgrade --install against EKS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          helm upgrade --install strapi charts/strapi \
            -f charts/strapi/values.yaml \
            -f charts/strapi/values-eks.yaml \
            --set strapi.image.tag=${{ github.sha }} \
            --wait --timeout 180s

      - name: Verify the deployed app is actually reachable over HTTPS
        if: steps.check.outputs.cluster_up == 'true'
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(curl -sk -o /dev/null -w '%{http_code}' https://cms.aws.tn4consulting.com/_health || echo 000)
            [ "$status" = "204" ] && break
            sleep 5
          done
          status=$(curl -sk -o /dev/null -w '%{http_code}' https://cms.aws.tn4consulting.com/_health)
          [ "$status" = "204" ]
