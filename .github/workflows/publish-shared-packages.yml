name: Publish shared packages

# Publishes every libs/shared/* package to GitHub Packages under the
# @tn4consulting scope -- see CLAUDE.md's "Strong contracts" section for why
# this exists: each split-out app repo depends on pinned versions of these
# instead of a hand-copied source import, and the TypeScript types published
# alongside are the actual enforced contract.
#
# Safe to run on every push that touches libs/shared/** even when most
# individual libs haven't had a version bump -- publish-shared-lib.mjs
# treats "version already published" as a no-op, not a failure, so bumping
# one lib's version doesn't require this workflow to know which one changed.
on:
  push:
    branches: [main]
    paths:
      - 'libs/shared/**'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A repo-scoped GITHUB_TOKEN can publish/read packages this repo owns in
    # the common case, but empirically each of this org's private
    # @tn4consulting/* packages carries its own independent, inconsistently-
    # configured per-package "Manage Actions access" allowlist/role --
    # confirmed by hitting both ERR_PNPM_FETCH_401 (read) on the install step
    # and a 403 permission_denied: write_package on individual publish steps,
    # for different packages, even once each package's allowlist looked
    # correctly configured. NPM_READ_TOKEN (repo secret) is a PAT with both
    # read:packages and write:packages, confirmed working against every
    # package -- used job-wide instead of chasing each package's own
    # Actions-access setting individually.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tn4consulting'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish shared-auth
        run: node tools/scripts/publish-shared-lib.mjs auth --publish

      - name: Publish shared-auth-server
        run: node tools/scripts/publish-shared-lib.mjs auth-server --publish

      - name: Publish shared-content-client
        run: node tools/scripts/publish-shared-lib.mjs content-client --publish

      - name: Publish shared-federation-config
        run: node tools/scripts/publish-shared-lib.mjs federation-config --publish

      - name: Publish shared-federation-runtime
        run: node tools/scripts/publish-shared-lib.mjs federation-runtime --publish

      - name: Publish shared-i18n
        run: node tools/scripts/publish-shared-lib.mjs i18n --publish

      - name: Publish shared-remote-registry
        run: node tools/scripts/publish-shared-lib.mjs remote-registry --publish

      - name: Publish shared-runtime-config
        run: node tools/scripts/publish-shared-lib.mjs runtime-config --publish

      - name: Publish shared-session-cache
        run: node tools/scripts/publish-shared-lib.mjs session-cache --publish

      - name: Publish shared-observability-server
        run: node tools/scripts/publish-shared-lib.mjs observability-server --publish

      - name: Publish shared-observability
        run: node tools/scripts/publish-shared-lib.mjs observability --publish

      # Framework-agnostic Stencil custom elements (ScdsCard,
      # ScdsMultiColumnList) -- no @tn4consulting dependencies of its own,
      # published before ui-scds since ui-scds's Angular wrapper is (or
      # will be) generated from this package's build output.
      - name: Publish shared-ui-scds-core
        run: node tools/scripts/publish-shared-lib.mjs ui-scds-core --publish

      # ui-scds has no dependency on shared-auth/shared-i18n (unlike ui-gcds
      # below), so it doesn't need to run after them -- deliberately ordered
      # before ui-gcds so a ui-gcds build failure (a real, separate, as-yet-
      # unresolved TS5062 path-mapping error building ui-gcds against
      # @tn4consulting/shared-auth/core -- see TODO.md) doesn't also block
      # ui-scds from publishing, since a failed step stops the whole job.
      - name: Publish shared-ui-scds
        run: node tools/scripts/publish-shared-lib.mjs ui-scds --publish

      # ui-gcds depends on shared-auth and shared-i18n (see its package.json)
      # -- publish it last so a fresh version of either is already available
      # if this run also bumped them.
      - name: Publish shared-ui-gcds
        run: node tools/scripts/publish-shared-lib.mjs ui-gcds --publish
