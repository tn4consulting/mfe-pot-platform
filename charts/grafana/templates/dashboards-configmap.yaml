apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.name }}-dashboards
  labels:
    app.kubernetes.io/name: {{ .Values.grafana.name }}
    app.kubernetes.io/component: observability
data:
  # Read straight from this chart's own dashboards/ directory (not
  # duplicated inline here) so the JSON has one source of truth -- every
  # *.json file dropped in dashboards/ is picked up automatically, no
  # per-dashboard template change needed. See mfe-pot-platform/CLAUDE.md's
  # observability section for what each dashboard shows.
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
