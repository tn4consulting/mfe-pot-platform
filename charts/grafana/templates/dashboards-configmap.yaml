apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.name }}-dashboards
  labels:
    app.kubernetes.io/name: {{ .Values.grafana.name }}
    app.kubernetes.io/component: observability
data:
  # Read straight from this chart's own dashboards/ directory (not
  # duplicated inline here) so the JSON has one source of truth. See
  # mfe-pot-platform/CLAUDE.md's observability section for what this
  # dashboard shows and why it's built on Tempo's span-metrics rather than
  # each BFF's own HTTP auto-instrumentation metrics.
  bff-red-metrics.json: |-
{{ .Files.Get "dashboards/bff-red-metrics.json" | indent 4 }}
