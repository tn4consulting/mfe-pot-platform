apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.grafana.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.grafana.name }}
    app.kubernetes.io/component: observability
spec:
  replicas: {{ .Values.grafana.replicaCount | default 1 }}
  # No PersistentVolume -- all state (datasources, dashboards, admin
  # credentials) is provisioned via ConfigMap/env, so every replica
  # self-provisions identically on boot. Safe to scale and roll without a
  # gap, same reasoning as charts/otel-collector. See mfe-pot/TODO.md's
  # "Design principles" section, principles 3/4. Caveat: anything a human
  # ever creates through Grafana's own UI (dashboards/alerts/users beyond
  # the provisioned admin) would land in only one replica's local SQLite --
  # not a concern today since nothing in this chart does that.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.grafana.name }}
      app.kubernetes.io/component: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.grafana.name }}
        app.kubernetes.io/component: observability
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .Values.grafana.name }}
                    app.kubernetes.io/component: observability
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ .Values.grafana.name }}
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.grafana.httpPort }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.grafana.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.grafana.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: {{ .Values.grafana.name }}-datasources
        - name: dashboard-provider
          configMap:
            name: {{ .Values.grafana.name }}-dashboard-provider
        - name: dashboards
          configMap:
            name: {{ .Values.grafana.name }}-dashboards
