apiVersion: v2
name: job-bank
description: >-
  Deploys the job-bank frontend + job-bank-bff pair as one Helm release,
  independent of every other mfe-pot app -- `helm upgrade --install
  job-bank ./charts/job-bank` touches only these two. Currently built and
  validated inside the platform repo (see
  docs/plans/20260801-1935-mfe-pot-polyrepo-split-and-k8s-hosting.md); once
  job-bank is extracted into its own repo (Phase 1), this chart moves with
  it and its library-chart dependencies resolve from a packaged/OCI
  reference instead of the local relative paths used for now.
type: application
version: 0.1.0
dependencies:
  - name: mfe-frontend-lib
    version: 0.1.0
    repository: "file://../mfe-frontend-lib"
  - name: mfe-backend-lib
    version: 0.1.0
    repository: "file://../mfe-backend-lib"
