apiVersion: v2
name: mfe-backend-lib
description: >-
  Reusable Deployment/Service/ConfigMap/PodDisruptionBudget templates for
  an mfe-pot BFF (a plain Express/Node process listening on PORT, with a
  GET /health endpoint). Never installed directly -- each app's own
  application chart depends on this and calls its named templates. See
  CLAUDE.md's Hosting section.
type: library
version: 0.2.0
