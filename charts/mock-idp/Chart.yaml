apiVersion: v2
name: mock-idp
description: >-
  Deploys mock-idp, the mock IdP standing in for IBM Verify SaaS, as its
  own Helm release -- backend-only, no frontend counterpart (it's a
  hosted login page + token issuer, not a citizen-facing app). See
  apps/mock-idp's own doc comments and mfe-pot's plan doc for the full
  design rationale. Lives alongside mfe-backend-lib in this same repo, so
  its dependency resolves via a plain sibling-directory relative path, not
  the sibling-checkout-relative path the 5 app repos need.
type: application
version: 0.1.0
dependencies:
  - name: mfe-backend-lib
    version: 0.1.0
    repository: "file://../mfe-backend-lib"
