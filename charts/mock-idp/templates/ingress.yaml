apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mock-idp
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.backend.name }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # No frontend counterpart to split against -- every mock-idp
          # route (/authorize, /token, /.well-known/jwks.json, /health)
          # goes straight to the one backend Service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.name }}
                port:
                  number: {{ .Values.backend.servicePort | default .Values.backend.containerPort }}
