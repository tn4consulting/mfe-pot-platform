# Overrides layered on top of values.yaml for a real AWS EKS deployment (see
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md). See
# mfe-pot-job-bank-mfe/charts/job-bank-mfe/values-eks.yaml for the fuller
# explanatory comments this pattern was worked out against first.
#
# MOCK_IDP_ISSUER deliberately NOT overridden -- stays the in-cluster
# Service DNS value from values.yaml, identical on EKS and kind, and every
# BFF's own MOCK_IDP_ISSUER must keep matching it exactly (the `iss` claim
# baked into every issued JWT).

backend:
  image:
    repository: 147318891438.dkr.ecr.ca-central-1.amazonaws.com/mfe-pot-mock-idp
    pullPolicy: IfNotPresent
  env:
    # Both host apps' real public Ingress hostnames -- the citizen's own
    # browser sends one of these as redirect_uri during the top-level
    # /authorize navigation.
    ALLOWED_REDIRECT_URI_ORIGINS: "https://msca.aws.tn4consulting.com,https://job-bank.aws.tn4consulting.com"

ingress:
  host: mock-idp.aws.tn4consulting.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
