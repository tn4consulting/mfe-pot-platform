otelCollector:
  name: otel-collector
  # Stateless -- safe to scale. See deployment.yaml's own comment and
  # mfe-pot/TODO.md's "Design principles" section, principles 3/4. Local
  # kind default stays at 1 (limits resource pressure on a single-node dev
  # cluster) -- values-eks.yaml bumps this to 2.
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.158.0"
    pullPolicy: IfNotPresent
  # otlpHttpPort is the one port both BFFs (in-cluster) and browsers (via
  # this chart's Ingress) export to -- see charts/otel-collector/templates/
  # configmap.yaml's receivers block. otlpGrpcPort stays enabled (the
  # contrib image's default) but unexposed via the Service/Ingress -- no
  # current consumer needs it, kept as headroom rather than actively used.
  # prometheusPort is where Prometheus (charts/prometheus) scrapes exported
  # metrics from -- cluster-internal only, same as otlpGrpcPort.
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  prometheusPort: 8889
  healthPort: 13133
  # Browser-facing CORS allowlist for the otlp/http receiver above -- every
  # Ingress host that runs shared-observability's initBrowserObservability
  # (both host shells, all 4 remotes). values-eks.yaml overrides this
  # wholesale with the aws.tn4consulting.com equivalents, same split
  # ingress.host below already uses.
  corsAllowedOrigins:
    - "http://msca.mfe-pot.local"
    - "http://job-bank.mfe-pot.local"
    - "http://dashboard-mfe.mfe-pot.local"
    - "http://job-bank-mfe.mfe-pot.local"
    - "http://employment-insurance-mfe.mfe-pot.local"
    - "http://life-events-mfe.mfe-pot.local"

ingress:
  host: otel.mfe-pot.local
  className: nginx
  # TLS off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
