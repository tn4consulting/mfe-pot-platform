apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.prometheus.name }}-config
  labels:
    app.kubernetes.io/name: {{ .Values.prometheus.name }}
    app.kubernetes.io/component: observability
data:
  # Mounted over the image's own baked-in default at this exact path (see
  # templates/deployment.yaml). One scrape job, pointed at
  # charts/otel-collector's own Prometheus exporter -- fixed in-cluster
  # Service DNS, identical on kind and EKS.
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector.default.svc.cluster.local:8889
