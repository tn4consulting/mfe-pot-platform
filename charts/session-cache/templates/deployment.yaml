apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.redis.name }}
    app.kubernetes.io/component: session-cache
spec:
  # Deliberately NOT scaled -- single Redis, no clustering/replication
  # configured, so a second replica would just be a second, diverging
  # in-memory store, not real HA (the actual fix, Redis primary+replica or
  # Sentinel, is tracked separately -- see
  # docs/plans/20260808-1800-backend-outage-resilience.md). The strategy
  # block is a no-op formalization at replicas: 1 (matches Kubernetes' own
  # default rounding), not new behavior. See mfe-pot/TODO.md's "Design
  # principles" section, principles 3/4.
  replicas: {{ .Values.redis.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.redis.name }}
      app.kubernetes.io/component: session-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.redis.name }}
        app.kubernetes.io/component: session-cache
    spec:
      containers:
        - name: {{ .Values.redis.name }}
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.redis.containerPort }}
          # No persistence (no PersistentVolume) and no auth/password --
          # this is a resettable PoT demo cache with nothing real behind
          # it (see CLAUDE.md's "Security: defense in depth" -- the same
          # posture as charts/strapi's committed dummy secrets), not
          # durable or sensitive storage. Would need both before any real
          # (non-PoT) deployment.
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 10
