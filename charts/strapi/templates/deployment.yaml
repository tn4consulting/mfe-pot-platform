apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.strapi.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.strapi.name }}
    app.kubernetes.io/component: cms
spec:
  # Deliberately NOT scaled -- Strapi's SQLite file lives on the
  # container's own ephemeral filesystem (no volume at all, see the lack
  # of any volumeMounts below), so two replicas would each hold their own
  # independently-diverging copy of the CMS/federation-directory content.
  # The strategy block is a no-op formalization at replicas: 1 (matches
  # Kubernetes' own default rounding), not new behavior. See
  # mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  replicas: {{ .Values.strapi.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.strapi.name }}
      app.kubernetes.io/component: cms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.strapi.name }}
        app.kubernetes.io/component: cms
    spec:
      containers:
        - name: {{ .Values.strapi.name }}
          image: "{{ .Values.strapi.image.repository }}:{{ .Values.strapi.image.tag }}"
          imagePullPolicy: {{ .Values.strapi.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.strapi.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Values.strapi.name }}-env
            - secretRef:
                name: {{ .Values.strapi.name }}-secrets
          # `strapi develop` compiles the admin panel on first boot, much
          # slower than a plain Express BFF -- a generous readiness
          # failureThreshold instead of mfe-backend-lib's short one, so a
          # slow-but-healthy first start isn't mistaken for a crash loop.
          readinessProbe:
            httpGet:
              path: /_health
              port: {{ .Values.strapi.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_health
              port: {{ .Values.strapi.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
