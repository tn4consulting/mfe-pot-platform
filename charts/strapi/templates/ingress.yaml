apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.strapi.name }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.strapi.name }}
                port:
                  number: {{ .Values.strapi.servicePort | default .Values.strapi.containerPort }}
