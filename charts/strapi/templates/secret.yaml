{{/*
Split from configmap.yaml because these are crypto-secret-shaped values
(APP_KEYS, JWT_SECRET, etc.), unlike mfe-backend-lib's `backend.env` (plain
PORT/HOST/upstream-URL values). Still committed as dummy local-dev-only
plaintext in values.yaml -- there is no real user data behind this CMS to
protect.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.strapi.name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Values.strapi.name }}
    app.kubernetes.io/component: cms
type: Opaque
stringData:
  {{- range $key, $value := .Values.strapi.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
