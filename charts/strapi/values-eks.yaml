# Overrides layered on top of values.yaml for a real AWS EKS deployment (see
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md). See
# mfe-pot-job-bank-mfe/charts/job-bank-mfe/values-eks.yaml for the fuller
# explanatory comments this pattern was worked out against first.
#
# secretEnv is deliberately NOT overridden here -- these are already
# committed dummy local-dev-only values with no real user data behind this
# CMS, ever (see values.yaml's own comment). Not reused for anything real
# regardless of environment.

strapi:
  image:
    repository: 147318891438.dkr.ecr.ca-central-1.amazonaws.com/mfe-pot-strapi
    pullPolicy: IfNotPresent
  env:
    REMOTE_DASHBOARD_MFE_URL: "https://dashboard-mfe.aws.tn4consulting.com/remoteEntry.json"
    REMOTE_JOB_BANK_MFE_URL: "https://job-bank-mfe.aws.tn4consulting.com/remoteEntry.json"
    REMOTE_EMPLOYMENT_INSURANCE_MFE_URL: "https://employment-insurance-mfe.aws.tn4consulting.com/remoteEntry.json"
    REMOTE_LIFE_EVENTS_MFE_URL: "https://life-events-mfe.aws.tn4consulting.com/remoteEntry.json"

ingress:
  host: cms.aws.tn4consulting.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
