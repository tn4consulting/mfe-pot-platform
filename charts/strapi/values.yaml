strapi:
  name: strapi
  replicaCount: 1
  image:
    repository: mfe-pot-strapi
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 1337
  servicePort: 1337
  # Plain non-secret config, rendered as a ConfigMap. REMOTE_*_URL seed the
  # federation-directory entries src/index.ts's bootstrap creates -- each
  # app's real Ingress hostname here, not the localhost:XXXX dev-server
  # ports src/index.ts falls back to, since a *reachable* Strapi serving
  # *wrong* URLs is worse than an unreachable one: every app's
  # resolveFederationManifest() only falls back to its own configured
  # `remotes` map when Strapi itself is unavailable, not when its data is
  # stale.
  env:
    HOST: "0.0.0.0"
    PORT: "1337"
    # Matches the Dockerfile's `npm run develop` -- Strapi's production
    # `start` command needs a prior `strapi build` of the admin panel,
    # which this image doesn't do. develop mode is what's already proven
    # working via docker-compose; not introducing an unproven production
    # build path just for this chart.
    NODE_ENV: "development"
    REMOTE_DASHBOARD_MFE_URL: "http://dashboard-mfe.mfe-pot.local/remoteEntry.json"
    REMOTE_JOB_BANK_MFE_URL: "http://job-bank-mfe.mfe-pot.local/remoteEntry.json"
    REMOTE_EMPLOYMENT_INSURANCE_MFE_URL: "http://employment-insurance-mfe.mfe-pot.local/remoteEntry.json"
    REMOTE_EMPLOYMENT_LIFE_EVENTS_MFE_URL: "http://employment-life-events-mfe.mfe-pot.local/remoteEntry.json"
  # Rendered as a Secret instead of the ConfigMap above. Dummy local-dev-only
  # values (no real user data behind this CMS, ever) -- do not reuse them
  # for anything real.
  secretEnv:
    APP_KEYS: "devKeyA==,devKeyB==,devKeyC==,devKeyD=="
    API_TOKEN_SALT: "devApiTokenSalt=="
    ADMIN_JWT_SECRET: "devAdminJwtSecret=="
    JWT_SECRET: "devJwtSecret=="
    TRANSFER_TOKEN_SALT: "devTransferTokenSalt=="
    ENCRYPTION_KEY: "devEncryptionKey=="

# The hostname is deliberately "cms", not "strapi" -- Strapi is an
# implementation detail, "cms" is what a citizen-facing or demo-facing
# hostname should say.
ingress:
  host: cms.mfe-pot.local
  className: nginx
  # TLS is off by default (kind/local has no real cert authority) --
  # values-eks.yaml turns this on for a real AWS deployment. See
  # templates/ingress.yaml for how these two fields are consumed.
  tls:
    enabled: false
    clusterIssuer: letsencrypt-staging
