apiVersion: v2
name: tempo
description: >-
  Deploys Grafana Tempo (single-binary mode) as its own shared Helm release
  -- trace storage backing the Grafana Explore view, receiving OTLP/gRPC
  from charts/otel-collector's own trace pipeline. Cluster-internal only, no
  Ingress -- nothing outside the cluster talks to Tempo directly. Bare
  upstream image, no PersistentVolume (resettable demo trace storage, not
  durable -- same posture as charts/session-cache's Redis). Installed once,
  independently of any per-app chart.
type: application
version: 0.1.0
