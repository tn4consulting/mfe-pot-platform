apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tempo.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.tempo.name }}
    app.kubernetes.io/component: observability
spec:
  # Deliberately NOT scaled to replicas: 2 like otel-collector/grafana --
  # local emptyDir trace storage (see volumes below) with no ingester
  # ring/distributor-hash coordination means two uncoordinated replicas
  # would each hold only the traces they happened to receive, so queries
  # would return incomplete results. The strategy/no-gap-rolling-update
  # block below is still worth having explicit (matches the actual current
  # Kubernetes default at replicas: 1 -- maxSurge/maxUnavailable both round
  # to this same shape -- so it's a no-op formalization, not new behavior).
  # See mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  replicas: {{ .Values.tempo.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.tempo.name }}
      app.kubernetes.io/component: observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.tempo.name }}
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: {{ .Values.tempo.name }}
          image: "{{ .Values.tempo.image.repository }}:{{ .Values.tempo.image.tag }}"
          imagePullPolicy: {{ .Values.tempo.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "-config.file=/etc/tempo.yaml"
          ports:
            - name: http
              containerPort: {{ .Values.tempo.httpPort }}
            - name: otlp-grpc
              containerPort: {{ .Values.tempo.otlpGrpcPort }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
            - name: storage
              mountPath: /var/tempo
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.tempo.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.tempo.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ .Values.tempo.name }}-config
        # emptyDir, not a PersistentVolumeClaim -- a resettable demo trace
        # store, not durable storage (see Chart.yaml/configmap.yaml
        # comments). Gone on pod restart, same as Redis's own lack of
        # persistence in charts/session-cache.
        - name: storage
          emptyDir: {}
