apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.unleash.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.unleash.name }}
    app.kubernetes.io/component: unleash
spec:
  replicas: {{ .Values.unleash.replicaCount | default 1 }}
  # Unleash itself is stateless -- all reads/writes go through to its own
  # Postgres (postgres-deployment.yaml, deliberately NOT scaled -- see its
  # own comment), so this Deployment is safe to scale and roll without a
  # gap. See mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.unleash.name }}
      app.kubernetes.io/component: unleash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.unleash.name }}
        app.kubernetes.io/component: unleash
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .Values.unleash.name }}
                    app.kubernetes.io/component: unleash
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ .Values.unleash.name }}
          image: "{{ .Values.unleash.image.repository }}:{{ .Values.unleash.image.tag }}"
          imagePullPolicy: {{ .Values.unleash.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.unleash.containerPort }}
          env:
            - name: DATABASE_HOST
              value: {{ .Values.postgres.name | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.postgres.servicePort | default .Values.postgres.containerPort | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.postgres.db | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.postgres.user | quote }}
            - name: DATABASE_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: DATABASE_SSL
              value: "false"
            # Bootstraps a fixed admin + client API token on startup instead
            # of the interactive first-run wizard -- needed since nothing
            # ever clicks through the Unleash admin UI by hand as part of
            # bringing this cluster up. See values.yaml's comment on why
            # these are committed plainly.
            - name: INIT_ADMIN_API_TOKENS
              value: {{ .Values.unleash.adminApiToken | quote }}
            - name: INIT_CLIENT_API_TOKENS
              value: {{ .Values.unleash.clientApiToken | quote }}
            - name: INIT_FRONTEND_API_TOKENS
              value: {{ .Values.unleash.frontendApiToken | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.unleash.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.unleash.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
