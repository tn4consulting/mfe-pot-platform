# Overrides layered on top of values.yaml for a real AWS EKS deployment (see
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md). No
# image.repository override needed for either container -- unlike
# strapi/mock-idp, this chart has no Dockerfile of its own to push to ECR;
# it pulls the same public Docker Hub images on both kind and EKS.

ingress:
  host: unleash.aws.tn4consulting.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
