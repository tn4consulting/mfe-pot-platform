services:
  strapi:
    build: ./tools/cms/strapi
    ports:
      - '1337:1337'
    # Dummy local-dev-only secrets (no real user data behind this CMS, ever)
    # committed here so `docker compose up` works out of the box on a fresh
    # clone -- do NOT reuse these values for anything real.
    environment:
      APP_KEYS: 'devKeyA==,devKeyB==,devKeyC==,devKeyD=='
      API_TOKEN_SALT: 'devApiTokenSalt=='
      ADMIN_JWT_SECRET: 'devAdminJwtSecret=='
      JWT_SECRET: 'devJwtSecret=='
      TRANSFER_TOKEN_SALT: 'devTransferTokenSalt=='
      ENCRYPTION_KEY: 'devEncryptionKey=='
    # No volume for .tmp/data.db on purpose: bootstrap seeding (src/index.ts)
    # is idempotent, so a fresh container always comes up in the same known
    # state -- exactly what repeatable local demos need.
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:1337/_health", (r) => process.exit(r.statusCode === 204 ? 0 : 1)).on("error", () => process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 20
